  }
  input:focus { outline: none; border-color: #4A90E2; }
  button {
    width: 100%;

  canvas { max-width: 100%; }
  .record-row {
    display: flex;
    align-items: center;

  .record-row:last-child { border-bottom: none; }

  .record-value { font-weight: bold; flex: 1; text-align: right; margin-right: 10px; }
  .delete-btn {

<div class="cp-side right"><iframe src="https://ads-partners.coupang.com/widgets.html?id=1026276&template=banner&trackingCode=AF4842061&subId=weight_right&width=160&height=600" width="160" height="600" frameborder="0" scrolling="no" referrerpolicy="unsafe-url"></iframe><div class="cp-note">쿠팡 파트너스 활동으로<br>일정 수수료를 제공받습니다</div></div>
<div class="container">
  <h1>⚖️ 몸무게 기록 그래프</h1>

  <section>
    <h2>1. 오늘 기록 추가하기</h2>
    <label for="dateInput">날짜</label>
    <input id="dateInput" type="date">
    <label for="valueInput">몸무게 (kg)</label>
    <input id="valueInput" type="number" step="0.1" inputmode="decimal" placeholder="예: 65.5">
    <button id="addBtn">+ 추가하기</button>
  </section>

  <section>
    <h2>2. 이번 주 요약</h2>
    <div class="stats-row">
      <div class="stat-box">
        <div class="label">이번 주 평균</div>
        <div class="value" id="thisWeekAvg">—</div>
      </div>
      <div class="stat-box">
        <div class="label">지난주 대비</div>
        <div class="value" id="weekChange">—</div>
      </div>
    </div>
  </section>

  <section>
    <h2>3. 변화 그래프</h2>
    <canvas id="chart" height="220"></canvas>
    <p id="chartEmptyMsg">기록을 추가하면 그래프가 여기 나와요.</p>
  </section>

  <section>
    <h2>4. 전체 기록</h2>
    <div id="recordList"></div>
    <p id="emptyMsg">아직 기록이 없어요.</p>
  </section>

  <button id="resetBtn">전체 기록 지우기</button>

  <div class="cp-bottom">
    <div class="cp-bottom-frame"><div class="cp-bottom-inner" style="width:728px;height:100px;"><iframe src="https://ads-partners.coupang.com/widgets.html?id=1026279&template=carousel&trackingCode=AF4842061&subId=weight_bottom&width=728&height=100&tsource=" width="728" height="100" frameborder="0" scrolling="no" referrerpolicy="unsafe-url"></iframe></div></div>
    <div class="cp-note">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다</div>
  </div>
</div>

<script>
(function(){
  function fit(){
    document.querySelectorAll('.cp-bottom').forEach(function(box){
      var frame = box.querySelector('.cp-bottom-frame');
      var inner = box.querySelector('.cp-bottom-inner');
      var ratio = Math.min(1, box.clientWidth/728);
      inner.style.transform = 'scale('+ratio+')';
      frame.style.height = (100*ratio)+'px';
    });
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
<script>
  const dateInput = document.getElementById('dateInput');
  const valueInput = document.getElementById('valueInput');
  const addBtn = document.getElementById('addBtn');
  const resetBtn = document.getElementById('resetBtn');
  const recordList = document.getElementById('recordList');
  const emptyMsg = document.getElementById('emptyMsg');
  const chartEmptyMsg = document.getElementById('chartEmptyMsg');
  const thisWeekAvgEl = document.getElementById('thisWeekAvg');
  const weekChangeEl = document.getElementById('weekChange');
  const canvas = document.getElementById('chart');

  const 저장키 = '몸무게기록_v1';
  let records = JSON.parse(localStorage.getItem(저장키) || '[]');
  let chart = null;

  // 오늘 날짜를 기본값으로
  dateInput.value = new Date().toLocaleDateString('sv-SE');

  function 저장() {
    localStorage.setItem(저장키, JSON.stringify(records));
  }

  function 정렬된기록() {
    return [...records].sort((a, b) => a.date.localeCompare(b.date));
  }

  addBtn.addEventListener('click', () => {
    const date = dateInput.value;
    const value = parseFloat(valueInput.value);

    if (!date) { alert('날짜를 선택해주세요.'); return; }
    if (isNaN(value) || value <= 0) { alert('몸무게를 올바르게 입력해주세요.'); valueInput.focus(); return; }

    const 기존 = records.find(r => r.date === date);
    if (기존) {
      기존.value = value;
    } else {
      records.push({ date, value });
    }
    valueInput.value = '';
    저장();
    render();
  });

  resetBtn.addEventListener('click', () => {
    if (records.length === 0) return;
    if (confirm('모든 기록을 지울까요? 되돌릴 수 없어요.')) {
      records = [];
      저장();
      render();
    }
  });

  function deleteRecord(date) {
    records = records.filter(r => r.date !== date);
    저장();
    render();
  }

  function formatDate(d) {
    const [y, m, day] = d.split('-');
    return `${m}/${day}`;
  }

  function render() {
    renderList();
    renderStats();
    renderChart();
  }

  function renderList() {
    const 정렬 = [...정렬된기록()].reverse(); // 최신이 위로
    recordList.innerHTML = '';
    emptyMsg.style.display = 정렬.length === 0 ? 'block' : 'none';

    정렬.forEach(r => {
      const row = document.createElement('div');
      row.className = 'record-row';
      row.innerHTML = `
        <span class="record-date">${r.date}</span>
        <span class="record-value">${r.value.toFixed(1)} kg</span>
        <button class="delete-btn" data-date="${r.date}">삭제</button>
      `;
      recordList.appendChild(row);
    });
    recordList.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteRecord(btn.dataset.date));
    });
  }

  // 이번 주(월~일) 시작일을 반환
  function 주시작일(기준날짜) {
    const d = new Date(기준날짜);
    const 요일 = (d.getDay() + 6) % 7; // 월요일=0 ~ 일요일=6
    d.setDate(d.getDate() - 요일);
    return d;
  }

  function toKey(d) {
    return d.toLocaleDateString('sv-SE');
  }

  function 평균구하기(시작, 끝) {
    const 대상 = records.filter(r => r.date >= 시작 && r.date <= 끝);
    if (대상.length === 0) return null;
    const 합 = 대상.reduce((s, r) => s + r.value, 0);
    return 합 / 대상.length;
  }

  function renderStats() {
    const 오늘 = new Date();
    const 이번주시작 = 주시작일(오늘);
    const 이번주끝 = new Date(이번주시작); 이번주끝.setDate(이번주끝.getDate() + 6);
    const 지난주시작 = new Date(이번주시작); 지난주시작.setDate(지난주시작.getDate() - 7);
    const 지난주끝 = new Date(이번주시작); 지난주끝.setDate(지난주끝.getDate() - 1);

    const 이번주평균 = 평균구하기(toKey(이번주시작), toKey(이번주끝));
    const 지난주평균 = 평균구하기(toKey(지난주시작), toKey(지난주끝));

    thisWeekAvgEl.textContent = 이번주평균 === null ? '기록 없음' : `${이번주평균.toFixed(1)} kg`;

    if (이번주평균 === null || 지난주평균 === null) {
      weekChangeEl.textContent = '비교 불가';
      weekChangeEl.className = 'value';
    } else {
      const 차이 = 이번주평균 - 지난주평균;
      const 부호 = 차이 > 0 ? '+' : '';
      weekChangeEl.textContent = `${부호}${차이.toFixed(1)} kg ${차이 > 0 ? '▲' : (차이 < 0 ? '▼' : '-')}`;
      weekChangeEl.className = 'value ' + (차이 > 0 ? 'up' : (차이 < 0 ? 'down' : ''));
    }
  }

  function renderChart() {
    const 정렬 = 정렬된기록();
    chartEmptyMsg.style.display = 정렬.length === 0 ? 'block' : 'none';
    canvas.style.display = 정렬.length === 0 ? 'none' : 'block';
    if (정렬.length === 0) {
      if (chart) { chart.destroy(); chart = null; }
      return;
    }

    const labels = 정렬.map(r => formatDate(r.date));
    const data = 정렬.map(r => r.value);

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.update();
      return;
    }

    chart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '몸무게 (kg)',
          data: data,
          borderColor: '#4A90E2',
          backgroundColor: 'rgba(74, 144, 226, 0.15)',
          borderWidth: 3,
          pointRadius: 4,
          pointBackgroundColor: '#4A90E2',
          tension: 0.25,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { ticks: { font: { size: 13 } } },
          x: { ticks: { font: { size: 12 } } }
        }
      }
    });
  }

  render();
</script>
</body>
